services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}

    image: ai-chatbot-frontend:latest
    container_name: ai-chatbot-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env
