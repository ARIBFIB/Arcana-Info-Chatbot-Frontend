# Install on the VM host (not inside Docker).
#   sudo cp nginx/default.conf /etc/nginx/sites-available/ai-chatbot
#   sudo ln -s /etc/nginx/sites-available/ai-chatbot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream nextjs {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name YOUR_VM_PUBLIC_IP;

    client_max_body_size 20M;

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uncomment when backend runs on the same VM (see docs/DEPLOYMENT.md §8).
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
